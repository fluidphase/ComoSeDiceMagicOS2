name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project.zip
        run: |
          set -e
          test -f project.zip || { echo "project.zip not found in repo root"; exit 1; }
          rm -rf _src && mkdir _src
          unzip -q project.zip -d _src
          SETTINGS=$(find _src -maxdepth 3 -name settings.gradle.kts | head -n1)
          [ -n "$SETTINGS" ] || { echo "settings.gradle.kts not found in zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MagicLauncher-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
